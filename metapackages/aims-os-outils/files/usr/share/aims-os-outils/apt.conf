// aims-os-outils : réglages apt du service aims-outils seulement (APT_CONFIG),
// les commandes apt de la personne gardent les leurs.
// Le campus n'a pas d'IPv6 et coupe parfois une connexion, comme au labo.
Acquire::ForceIPv4 "true";
Acquire::Retries "5";
// Le premier passage démarre pendant l'installation du paquet : il attend la
// fin d'apt au lieu d'échouer sur le verrou de dpkg.
DPkg::Lock::Timeout "3600";
