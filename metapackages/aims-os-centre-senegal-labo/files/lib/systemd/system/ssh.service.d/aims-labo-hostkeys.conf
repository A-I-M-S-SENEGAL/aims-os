# A freshly cloned machine has no SSH host keys (removed before capture), and
# sshd refuses to start without them: the IT team could not reach a clone
# for the 10 to 15 minutes before the hourly repair regenerated them
# (8 September 2026). Generate them before the config check.
[Service]
ExecStartPre=
ExecStartPre=-/usr/bin/ssh-keygen -A
ExecStartPre=/usr/sbin/sshd -t
