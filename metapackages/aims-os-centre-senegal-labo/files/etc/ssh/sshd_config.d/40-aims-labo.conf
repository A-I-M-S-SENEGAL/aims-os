# AIMS OS — lab workstation SSH policy (aims-os-centre-senegal-labo).
# Debian includes sshd_config.d/*.conf at the top of sshd_config and
# sshd keeps the FIRST value of each keyword, so this file wins over
# /etc/ssh/sshd_config. Key only, IT account only.
PubkeyAuthentication yes
PasswordAuthentication no
KbdInteractiveAuthentication no
PermitRootLogin no
AllowUsers aimsit
AuthorizedKeysFile .ssh/authorized_keys /etc/ssh/authorized_keys.d/%u
