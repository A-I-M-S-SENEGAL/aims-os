# AIMS OS — lab workstation SSH policy (aims-os-centre-senegal-labo).
# Named 00-* so it sorts before 04-ipa.conf (written by ipa-client-install,
# which turns ChallengeResponseAuthentication back on): sshd keeps the
# FIRST value of each keyword.
# Debian includes sshd_config.d/*.conf at the top of sshd_config and
# sshd keeps the FIRST value of each keyword, so this file wins over
# /etc/ssh/sshd_config.
# Two ways in, both reserved for the IT team (decision of 8 September 2026):
#   - the local aimsit account, key only, the key lives in the team vault;
#   - a personal directory account in the admins group, with its own
#     password, allowed by HBAC rule admins-partout and named in the
#     central log.
# Students sit in the etudiants group, so they never match AllowGroups.
# The firewall only accepts port 22 from the campus subnet, and rate limits
# repeated attempts.
PubkeyAuthentication yes
PasswordAuthentication yes
KbdInteractiveAuthentication yes
PermitEmptyPasswords no
PermitRootLogin no
AllowGroups aims-ssh admins
AuthorizedKeysFile .ssh/authorized_keys /etc/ssh/authorized_keys.d/%u
# 6, the OpenSSH default, not less: every public key the client offers before
# the password counts as an attempt, so a laptop with a few keys in its agent
# is cut off ("Too many authentication failures") before it ever reaches the
# password. Brute force is handled by the firewall rule and the central log.
MaxAuthTries 6
LoginGraceTime 30
