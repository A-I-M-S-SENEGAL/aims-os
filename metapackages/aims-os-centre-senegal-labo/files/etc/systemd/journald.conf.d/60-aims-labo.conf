# Un programme qui part en boucle peut écrire des millions de lignes : on
# limite ce que le journal garde et la vitesse à laquelle une unité peut
# écrire, pour qu'une seule application ne puisse plus saturer le disque ni
# le processeur du poste (incident Packet Tracer du 8 septembre 2026).
[Journal]
SystemMaxUse=1G
RuntimeMaxUse=200M
RateLimitIntervalSec=30s
RateLimitBurst=2000
