# AIMS OS labo — the campus network is IPv4-only, yet the Wi-Fi hands out
# IPv6 router advertisements without connectivity: connections to hosts
# that publish AAAA records (packages.microsoft.com and friends) hung for
# minutes before falling back (labo-hp-01, 2026-09-07). Off until the
# campus routes IPv6 for real.
net.ipv6.conf.all.disable_ipv6 = 1
net.ipv6.conf.default.disable_ipv6 = 1
