# =============================================================================
# AIMS OS — Calamares "finished" module
# =============================================================================
# Overrides calamares-settings-debian's finished.conf (restartNowCommand:
# "systemctl -i reboot").
#
# Why: the AIMS OS live can be started over the network from the FOG server
# (root filesystem on NFS). A regular reboot tears the network down before
# systemd has finished stopping services that still live on that NFS root,
# and the machine hangs forever in "A stop job is running" (2026-09-03).
# The target disk is already unmounted and synced by Calamares' own
# umount step, so nothing of value is lost by rebooting immediately:
# `systemctl reboot -ff` syncs and reboots without stopping units or
# unmounting. USB-booted lives get the same fast, clean restart.
#
# Schema reference:
# https://github.com/calamares/calamares/blob/calamares/src/modules/finished/finished.conf
# =============================================================================
---
restartNowMode: "user-checked"
restartNowCommand: "systemctl reboot -ff"
notifyOnFinished: false
